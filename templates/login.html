<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | DocTalk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: rgba(255,255,255,0.05);
      padding: 40px 36px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 28px;
      color: #38bdf8;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    input {
      padding: 12px 14px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }
    input[type="email"],
    input[type="password"] {
      background: #1e293b;
      color: #fff;
    }
    button {
      background: linear-gradient(90deg, #0ea5e9, #3b82f6);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
    }
    button:hover {
      opacity: 0.9;
    }
    .links {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #94a3b8;
    }
    .links a {
      color: #38bdf8;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .flash {
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Welcome back to <span style="color:#60a5fa;">DocTalk</span></h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="email" name="email" placeholder="Email address" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <div class="links">
      Don’t have an account?
      <a href="{{ url_for('signup') }}">Sign up</a>
    </div>
  </div>
</body>
</html>
