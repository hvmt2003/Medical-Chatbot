<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | DocTalk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .signup-container {
      background: rgba(255,255,255,0.05);
      padding: 40px 36px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .signup-container h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 28px;
      color: #38bdf8;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    input {
      padding: 12px 14px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
      background: #1e293b;
      color: #fff;
    }
    button {
      background: linear-gradient(90deg, #0ea5e9, #3b82f6);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
    }
    button:hover { opacity: 0.9; }
    .links {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #94a3b8;
    }
    .links a {
      color: #38bdf8;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
    .flash {
      background: #ef4444;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 12px;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #94a3b8;
      margin: 16px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #475569;
    }
    .divider:not(:empty)::before { margin-right: 0.75em; }
    .divider:not(:empty)::after { margin-left: 0.75em; }
    .google-btn {
      background: #fff;
      color: #000;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      width: 100%;
      transition: background 0.2s ease;
    }
    .google-btn:hover { background: #f1f1f1; }
    .google-btn img {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Create your <span style="color:#60a5fa;">DocTalk</span> account</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Manual Signup Form -->
    <form method="POST">
      <input type="text" name="name" placeholder="Full name" required />
      <input type="email" name="email" placeholder="Email address" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>

    <div class="divider">OR</div>

    <!-- Google Signup -->
    <form action="{{ url_for('google.login') }}" method="get">
      <button type="submit" class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
        Continue with Google
      </button>
    </form>

    <div class="links">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
</body>
</html>
