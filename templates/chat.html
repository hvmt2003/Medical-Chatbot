<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocTalk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="https://kit.fontawesome.com/a2e0b2b1f7.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="brand">DocTalk</div>
                <button class="btn-new" id="btn-new-chat">+ New chat</button>
            </div>
            <div class="search-wrap">
                <input type="text" id="search-chats" placeholder="Search chats..." />
            </div>
            <div class="chat-list" id="chat-list">
                </div>
            <div class="sidebar-footer">
                <a href="{{ url_for('logout') }}" style="color: #94a3b8; text-decoration: none;">Logout</a>
            </div>
        </div>

        <div class="main">
            <div class="topbar">
                <button class="btn-icon" id="toggle-sidebar"><i class="fa fa-bars"></i></button>
                <div class="title" id="chat-title">DocTalk</div>
                <div class="spacer"></div>
            </div>

            <div class="messages" id="messages">
                </div>

            <form class="composer" id="composer">
                <textarea id="input-msg" placeholder="Ask about symptoms, medicines, diet..."></textarea>
                <button id="send-btn" type="submit"><i class="fa fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <div class="modal hidden" id="rename-modal">
        <div class="modal-panel">
            <div>Rename chat</div>
            <input id="rename-input" type="text" style="width:100%; margin-top:10px; padding: 8px; border-radius: 8px; border: 0; background: #0b1624; color: var(--text);">
            <div class="modal-actions">
                <button id="rename-cancel">Cancel</button>
                <button id="rename-save" class="danger">Save</button>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="delete-modal">
        <div class="modal-panel">
            <div>Are you sure you want to delete this chat?</div>
            <div class="modal-actions">
                <button id="delete-cancel">Cancel</button>
                <button id="delete-confirm" class="danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
